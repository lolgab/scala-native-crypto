name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-linux:
    name: "Build and Test on Linux (Ubuntu)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: coursier/cache-action@v8
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Collect build information
        run: |
          clang++ --version
          openssl version
      - name: Check formatting
        run:
          ./mill --no-server mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
          # ./mill mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll --sources buildSources
      # - name: Check scalafix
      #   run:
      #     ./mill --no-server __.fix --check
      - name: Compile
        run: ./mill --no-server __.compile
      - name: Test
        run: ./mill --no-server __.test
      - name: Test publishArtifacts
        run: ./mill --no-server show __.publishArtifacts

  test-windows:
    name: "Build and Test on Windows"
    runs-on: windows-latest
    needs:
      - test-linux
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows # x64-windows-static
      VCPKG_ROOT: "${{ github.workspace }}\\vcpkg"
      VCPKG_INSTALLED_DIR: "${{ github.workspace }}\\vcpkg\\installed"
      VCPKG_COMMIT_ID: "66c0373dc7fca549e5803087b9487edfe3aca0a1" # vcpkg 2026.01.16 Release
    steps:
      - uses: actions/checkout@v6
      - uses: coursier/cache-action@v8
      - id: run-vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}"
          runVcpkgInstall: true
          doNotCache: false

      - name: Compile
        env:
          SCALANATIVE_INCLUDE_DIRS: "${{ env.VCPKG_INSTALLED_DIR }}\\${{ env.VCPKG_DEFAULT_TRIPLET }}\\include"
          SCALANATIVE_LIB_DIRS: "${{ env.VCPKG_INSTALLED_DIR }}\\${{ env.VCPKG_DEFAULT_TRIPLET }}\\lib"
        run: .\mill.bat --no-server __.compile
      - name: Test
        env:
          SCALANATIVE_INCLUDE_DIRS: "${{ env.VCPKG_INSTALLED_DIR }}\\${{ env.VCPKG_DEFAULT_TRIPLET }}\\include"
          SCALANATIVE_LIB_DIRS: "${{ env.VCPKG_INSTALLED_DIR }}\\${{ env.VCPKG_DEFAULT_TRIPLET }}\\lib"
        run: .\mill.bat --no-server __.test

  publish-sonatype:
    if: github.repository == 'lolgab/scala-native-crypto' && contains(github.ref, 'refs/tags/')
    needs:
      - test-linux
      - test-windows
    runs-on: ubuntu-latest
    env:
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - uses: actions/checkout@v6
      - uses: coursier/cache-action@v8
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Publish to Maven Central
        env:
          MILL_PGP_SECRET_BASE64: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY }}
          MILL_PGP_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./mill mill.javalib.SonatypeCentralPublishModule/
